<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AgentProof logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#141C36"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="180" fill="url(#glow)"/>

  <!-- outer seal -->
  <path d="M256 76 L412 166 L412 346 L256 436 L100 346 L100 166 Z"
        fill="none" stroke="url(#ink)" stroke-width="14" stroke-linejoin="round" opacity="0.95"/>
  <!-- inner seal -->
  <path d="M256 116 L376 185 L376 327 L256 396 L136 327 L136 185 Z"
        fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linejoin="round" opacity="0.28"/>

  <!-- checkmark -->
  <path d="M186 258 L238 310 L330 210"
        fill="none" stroke="url(#ink)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- evidence nodes -->
  <circle cx="256" cy="76" r="11" fill="#7DD3FC"/>
  <circle cx="100" cy="346" r="7" fill="#818CF8" opacity="0.8"/>
  <circle cx="412" cy="346" r="7" fill="#818CF8" opacity="0.8"/>
</svg>
